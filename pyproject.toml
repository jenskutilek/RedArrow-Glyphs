[project]
name = "redArrow"
version = "3.1.1"
description = "Outline checker for Glyphs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jens Kutílek", email = "webmail@kutilek.de" }]

dependencies = [
  "pyobjc",
]

[dependency-groups]
dev = [
  "mypy >= 2.4.0",
  "ruff >= 0.17.3",
]
test = [
  "pytest-cov >= 7.1.0",
  "pytest >= 9.2.0",
  "tox-gh >= 1.9.1",
  "tox-uv >= 1.37.2",
  "tox >= 4.67.4",
  { include-group = "dev" },
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
future-annotations = false
ignore = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["redArrow"]

[tool.uv.build-backend]
module-name = "redArrow"
module-root = "RedArrow.glyphsReporter/Contents/Resources"
